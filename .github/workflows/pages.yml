# Build the report site from Markdown and deploy it to GitHub Pages.
# Repository setting required once: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Deploy reports to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "content/**"
      - "templates/**"
      - "themes/**"
      - "scripts/build_site.py"
      - "marp.config.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # version comes from the packageManager field in package.json

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - run: pnpm install --frozen-lockfile

      - run: uv run scripts/build_site.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
