# Curated feed sources for the GenAI catch-up routine.
#
# Every feed listed here was fetched and confirmed to return XML/JSON on 2026-09-18
# (see docs/sources-notes.md for what died, moved, or has no feed).
#
# Fields
#   id           stable identifier, referenced from research notes (sources_used)
#   tier         1 = must-follow / low noise, 2 = weekly skim, 3 = monthly or on demand
#   kind         vendor | spec | analysis | media | aggregator
#   lang         optional, default en: language of the source's content (ja, ...)
#   reliability  A = primary source, B = reputable independent analysis, C = community / opinion (supplementary only)
#   track        genai-eng | coding-ai | both
#   role         changelog = releases and changes, read = human-written commentary, digest = aggregator
#   filter.any   optional case-insensitive keywords; an item must match at least one (title + summary)
#   max_items    optional per-source cap (default below)
#   enabled      optional, default true. Tier 3 sources ship disabled; enable them one by one.

defaults:
  max_items: 15
  enabled: true
  lang: en

sources:
