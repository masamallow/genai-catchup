# Curated feed sources for the GenAI catch-up routine.
#
# Every feed listed here was fetched and confirmed to return XML/JSON on 2026-09-18, or on
# 2026-10-27 for the sources added in the first monthly review
# (see docs/sources-notes.md for what died, moved, or has no feed).
#
# Fields
#   id           stable identifier, referenced from research notes (sources_used)
#   feed         the URL fetched: a feed, or a Hacker News search on hn.algolia.com (search_by_date with
#                tags=story, a points filter and typoTolerance=false, since the index applies typos to short
#                words: MCP matched Map); the fetcher narrows a search to the window and asks for 100 hits.
#   page         instead of feed: a Markdown or text page whose dated sections are the items, such as a
#                changelog with no feed; each section is offered once, keyed by its heading and its text,
#                and the item links to the page (readable as text, unlike a rendered site) with that key as the fragment.
#   tier         1 = must-follow / low noise, 2 = weekly skim, 3 = monthly or on demand
#   kind         vendor | spec | analysis | media | aggregator
#   lang         optional, default en: language of the source's content (ja, ...)
#   reliability  A = primary source, B = reputable independent analysis, C = community / opinion (supplementary only)
#   track        genai-eng | coding-ai | both
#   role         changelog = releases and changes, read = human-written commentary, digest = aggregator
#   filter.any   optional case-insensitive keywords; an item must match at least one (title + summary).
#                A filter keeps a feed to the scope in AGENTS.md; it does not find what is new.
#                Use category terms and long-lived names (platforms and tools the scope names,
#                major model vendors and their models, a vendor's own products in its own feed),
#                never a product added to catch one missed item.
#                For when a feed stays unfiltered, see docs/sources-notes.md ("Keyword filters").
#                A list shared by several feeds is written once with a YAML anchor (&name) and reused as *name.
#   filter.category
#                optional category names (whole names, case-insensitive); an item must carry one of them as a
#                feed category, so an untagged item is dropped. With filter.any, both must hold.
#   max_items    optional per-source cap (default below)
#   enabled      optional, default true. Tier 3 sources ship disabled; enable them one by one.

defaults:
  max_items: 15
  enabled: true
  lang: en

